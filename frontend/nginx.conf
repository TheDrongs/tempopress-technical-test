server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Script execution is same-origin only; blob images support local photo previews.
    # Radix components need inline CSS, but inline JavaScript and handlers stay blocked.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    # Up to ten 2 MiB photos plus multipart fields and headers.
    client_max_body_size 22m;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
